spring.application.name=risk-decision-engine

# Erros são devolvidos no formato Problem Details da RFC 9457 (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Limiares de decisão (pontuação de 0 a 100).
risco.decisao.limiar-revisao=40
risco.decisao.limiar-negacao=75

# Latência de rede simulada de cada fonte de sinais.
risco.sinais.lista-restritiva.latencia=20ms
risco.sinais.dispositivo.latencia=50ms
risco.sinais.historico.latencia=80ms

# Idempotência: por quanto tempo a avaliação de um idTransacao fica guardada no Redis.
risco.idempotencia.validade=24h

# Redis (suba com: docker compose up -d). Tempos curtos para que um Redis fora do ar
# não segure a avaliação: o motor segue sem idempotência.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms

# Kafka (suba com: docker compose up -d).
spring.kafka.bootstrap-servers=localhost:9092
# Produtor confiável: o broker só confirma depois de replicar (acks=all), e uma nova tentativa
# do produtor não duplica a mensagem no tópico (idempotência do produtor).
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Tempos curtos para que um Kafka fora do ar falhe rápido, em vez de segurar threads por 60 s.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.admin.operation-timeout=5s
# Consumidor que encaminha as decisões REVISAR para a revisão manual.
spring.kafka.consumer.group-id=motor-risco-revisao
spring.kafka.consumer.auto-offset-reset=earliest

# Observabilidade (Actuator). Os endpoints ficam abertos até a fase 5 (segurança).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Probes no estilo Kubernetes. A readiness não inclui Redis nem Kafka de propósito: a aplicação
# continua atendendo sem eles (sem idempotência e sem eventos), então não deve sair do ar.
management.endpoint.health.probes.enabled=true
# Toda métrica leva a tag application, para separar serviços no mesmo Prometheus.
management.metrics.tags.application=${spring.application.name}
# Histograma da latência da API, para calcular p95 e p99 no Prometheus.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Resiliência, aplicada a todas as fontes de sinais.
# Uma fonte mais lenta que o tempo limite é tratada como indisponível nesta avaliação.
risco.resiliencia.tempo-limite=200ms
# O circuito abre quando pelo menos 50% das últimas 10 chamadas falharam (avaliado a partir de 5 chamadas).
risco.resiliencia.tamanho-janela=10
risco.resiliencia.minimo-chamadas=5
risco.resiliencia.limite-taxa-falha=50
# Com o circuito aberto, a fonte é ignorada; depois de 10 s, 2 chamadas de teste verificam se ela voltou.
risco.resiliencia.espera-circuito-aberto=10s
risco.resiliencia.chamadas-semi-aberto=2

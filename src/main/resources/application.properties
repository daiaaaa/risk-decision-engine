spring.application.name=risk-decision-engine

# Errors are returned as RFC 9457 Problem Details (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Decision thresholds (score from 0 to 100).
risk.decision.review-threshold=40
risk.decision.deny-threshold=75

# Simulated network latency of each signal source.
risk.signals.deny-list.latency=20ms
risk.signals.device.latency=50ms
risk.signals.history.latency=80ms

# Resilience, applied to every signal source.
# A source slower than the timeout is treated as unavailable for this assessment.
risk.resilience.timeout=200ms
# The circuit opens when at least 50% of the last 10 calls failed (evaluated after 5 calls).
risk.resilience.sliding-window-size=10
risk.resilience.minimum-number-of-calls=5
risk.resilience.failure-rate-threshold=50
# While open, the source is skipped; after 10 s, 2 trial calls test whether it recovered.
risk.resilience.wait-duration-in-open-state=10s
risk.resilience.permitted-calls-in-half-open-state=2

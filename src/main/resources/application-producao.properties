# Perfil de produção: ative com --spring.profiles.active=producao.
#
# A documentação interativa fica desligada: o contrato expõe toda a superfície da API, e a
# Swagger UI não é necessária para quem só consome. Em produção, o contrato é publicado no
# portal de APIs da empresa, não pela própria aplicação.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

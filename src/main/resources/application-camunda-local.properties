# Perfil para rodar a aplicação de verdade contra o Camunda do compose.yaml: ative com
# --spring.profiles.active=camunda-local (ou SPRING_PROFILES_ACTIVE=camunda-local).
#
# application.properties não fixa esses endereços de propósito: nos testes, o
# CamundaSpringProcessTest sobe seu próprio Camunda via Testcontainers e precisa que o
# CamundaClient se conecte a ele, não a um endereço fixo (ver RevisaoManualProcessTest).
camunda.client.grpc-address=http://localhost:26500
camunda.client.rest-address=http://localhost:8083

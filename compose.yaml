# Infraestrutura local para rodar a aplicação: docker compose up -d
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  # Kafka em modo KRaft (sem ZooKeeper), com um único nó. A configuração padrão da
  # imagem oficial já anuncia o broker em localhost:9092.
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"

  # Servidor de autorização (OAuth2/OpenID Connect). Console em http://localhost:8180
  # (admin/admin). O realm motor-risco é importado na subida. Apenas para uso local.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Emissor fixo: o token sempre sai com iss=http://localhost:8180/..., inclusive quando
      # o Prometheus pede pela rede interna do Docker (keycloak:8080). Sem isso, a aplicação
      # recusaria o token do Prometheus por emissor diferente.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./seguranca/keycloak:/opt/keycloak/data/import:ro

  # Camunda 8 "lightweight": Zeebe + Operate + Tasklist num único container, com H2 em arquivo.
  # Sem autenticação (API pública), como no quickstart oficial; é o padrão do Camunda para
  # desenvolvimento local, e não o mesmo Keycloak usado pela API do motor de risco.
  # Operate/Tasklist: http://localhost:8083 (demo/demo). gRPC do Zeebe: localhost:26500.
  camunda:
    image: camunda/camunda:8.10.10
    ports:
      - "26500:26500" # gRPC (client)
      - "8083:8080"   # REST + Operate + Tasklist
    environment:
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_DATA_SECONDARYSTORAGE_TYPE: rdbms
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_URL: jdbc:h2:file:/usr/local/camunda/camunda-data/h2db
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      retries: 30
      start_period: 20s

  # Coleta as métricas da aplicação, que roda na máquina host (fora do Docker).
  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
    extra_hosts:
      # Necessário no Linux; no Docker Desktop (Windows/Mac) o nome já existe.
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - camunda

  # Painéis em http://localhost:3000. Acesso anônimo só de leitura; para editar,
  # entre com admin/admin. Configuração apenas para uso local.
  grafana:
    image: grafana/grafana:13.2.6
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/motor-risco.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  camunda-data:
